services:
  postgres:
    image: postgres:16-alpine
    container_name: lm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lm_user
      POSTGRES_PASSWORD: lm_password
      POSTGRES_DB: legal_metrology
    ports:
      - "5432:5432"
    volumes:
      - lm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lm_user -d legal_metrology"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lm_pgdata:
